# The film this repository builds. The filmkit engine takes every film-specific value from this
# declaration and the files it names; each edition's script declares its title, author,
# language, duration, frame rate and chapters. Paths are below the repository root.

# The prefix of every delivered file.
slug = "ddwg-essentials"
# The folder in ~/Documents that receives the delivery.
documents_folder = "ddwg-essentials-film"
# The page that leads to each edition's player.
entry = "content/index.html"
# The commit and digests of the canonical documents the films explain.
source_manifest = "content/source-manifest.json"
# What each concept the films name means in those documents, and each edition's words for it.
concepts = "content/concepts.toml"

# Each edition's folder of script, cast and player, and its 16:9 cover.
[editions.zh]
sources = "content"
cover = "assets/cover/ddwg-essentials-cover.png"

[editions.en]
sources = "content/en"
cover = "assets/cover/ddwg-essentials-cover-en.png"
# A term that reads as one name stays on one caption line, as do a verb and the object it
# takes, and a modifier and the noun it qualifies.
caption_terms = [
  "Data Department Work Guidelines",
  "authority to act",
  "authority about facts",
  "decision owner",
  "source of truth",
  "human–AI collaboration",
  "price data",
  "publication time",
  "job log",
  "primary records",
  "repeatable observations",
  "generated views",
  "Agent output",
  "independent review",
  "human acceptance",
  "collection job",
  "chain of trust",
  "authorization boundary",
  "department rule",
  "net benefit",
]

# The fonts the picture stages below fonts/, in this order: Noto Sans CJK SC, subset to the
# characters the film draws, for any text with a Chinese character, and IBM Plex Sans, unmodified,
# for Latin-only text.
[picture]
fonts = [
  "assets/fonts/noto-sans-cjk-sc-subset-regular.otf",
  "assets/fonts/noto-sans-cjk-sc-subset-bold.otf",
  "assets/fonts/ibm-plex-sans-regular.ttf",
  "assets/fonts/ibm-plex-sans-bold.ttf",
]

[review]
# The reviewer prompt: a str.format template that each round fills for each edition.
prompt = "content/review/prompt.md"
# The listening plan's analyst readings: context readings of Chinese words, and the English
# heteronyms with the part of speech of each occurrence, keyed by segment and offset in the script.
readings = "content/review/readings.json"
# The verifier's floor: the overall score and every dimension at least this.
overall_minimum = 95
dimension_minimum = 95

# The scored dimensions in record order, with what each one asks reviewers to judge.
[review.dimensions]
subject_and_faithfulness = """\
  the guidelines remain the subject; what they are for and why they hold come before how to \
  follow them; every claim follows its cited sections with their conditions and boundaries; the \
  late price data stays a made-up illustration; human and Agent responsibilities accurate."""
concept_fidelity = """\
  each concept the film names keeps its source meaning as the concept contract quotes it, in \
  the edition's one rendering through narration, captions, titles and picture; no rendering \
  narrows, personifies, substitutes or literally translates a concept."""
narrative_and_clarity = """\
  the real problem before the response; terms defined before use; connected argument; clear \
  chapter boundaries; ending returns to the opening; the edition stands alone."""
narration_identity_and_performance = """\
  same voice identity across editions; delivery natural (not sleepy, rushed or theatrical); \
  distinct thought pauses, paragraph boundaries and audible phrase tails; continuous and \
  idiomatic."""
pronunciation_and_bilingual_language = """\
  tones and polyphones in context or English vowels and stress; idiomatic language (not \
  translated); consistent terms."""
visual_explanation_and_motion = """\
  pictures explain relationships, operations, comparisons and consequences as narration \
  develops; restrained but varied, intentional 2D motion; text supports the visual argument."""
composition_and_typography = """\
  alignment guides, hierarchy, margins, density, modest single-line captions, consistent color \
  and contrast; collisions or clipping with timecodes."""
sound_picture_continuity = """\
  speech, captions, diagrams and scene changes synchronized; complete thoughts survive the \
  edit; image stays purposeful through transitions and pauses."""
credits_and_deliverable_craft = """\
  covers and Yang HENG metadata; restrained signature; subtitles and transcript match the \
  speech; chapters; player; opening, ending, covers and entry form one edition."""
